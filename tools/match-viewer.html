<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Agent Pitch · Match Viewer</title>
  <meta name="viewport" content="width=1440">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:ital,wght@0,400;0,500;0,700;0,900;1,700;1,900&display=swap" rel="stylesheet">
  <style>
    /* ── INLINE: design-system.css ── */
    /* ─────────────────────────────────────────────────────────────────
       Agent Pitch — Design System (canonical components)
       Source of truth: design/ux/components/components_design.html
       Load this stylesheet FIRST so per-module CSS can extend / override.
       ───────────────────────────────────────────────────────────────── */

    :root {
      /* ── Surfaces ── */
      --bg:        #0a0d10;
      --panel:     #11161b;
      --panel-2:   #161c22;
      --panel-3:   #1c232a;          /* viewer-only (kept for viewer chrome) */
      --line:      #242c34;
      --line-soft: #1a2128;
      --line-2:    #2f3a44;          /* viewer-only (kept for viewer chrome) */

      /* ── Ink ── */
      --ink:       #e8edf1;
      --ink-dim:   #9aa4ad;
      --ink-dimer: #5b6872;
      --ink-faint: #3a4550;

      /* ── Accent ── */
      --a:         #f2a44b;          /* Team A · primary accent */
      --a-dim:     #a87530;
      --a-ink:     #120a04;
      --b:         #b08cff;          /* Team B */

      /* ── Status ── */
      --ok:        #6ee3a5;
      --warn:      #f2a44b;
      --err:       #ff6b6b;

      /* ── Type ── */
      --font:      "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --font-disp: "Space Grotesk", -apple-system, "Segoe UI", sans-serif;

      /* Legacy alias used by shell.css / app.css / per-module CSS. */
      --font-mono: var(--font);
    }

    /* ── Base ── */
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-feature-settings: "zero" on, "ss01" on;
    }
    * { box-sizing: border-box; }

    /* Defensive: any [hidden] element must collapse, even if a layout
       rule below assigns it display:flex/grid. */
    [hidden] { display: none !important; }

    /* ───────────────────────────────────────────────────────────────── */
    /* SECTION HEADERS                                                  */
    /* ───────────────────────────────────────────────────────────────── */
    .ap-section {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 36px 0 18px;
      color: var(--ink-dim);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .ap-section .rule {
      flex: 1;
      height: 1px;
      background: var(--line);
    }
    .ap-section .reset {
      color: var(--a);
      text-decoration: none;
      font-size: 11px;
    }
    .ap-section .reset:hover { text-decoration: underline; }

    .sub-head {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-dim);
      margin: 0 0 14px;
    }
    .sub-head::before { content: "— "; color: var(--ink-dimer); }
    .sub-head::after  { content: " —"; color: var(--ink-dimer); }

    /* Panel / card */
    .ap-panel {
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 20px 24px;
      margin-bottom: 14px;
    }

    /* Tile grid (used in components reference and dashboard summaries) */
    .tile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
    }
    .tile {
      background: var(--panel);
      padding: 22px 22px 20px;
      display: flex;
      flex-direction: column;
      min-height: 128px;
    }
    .tile .label {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-dimer);
      margin-bottom: 14px;
    }
    .tile .body {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      flex: 1;
    }
    .tile .body.col { flex-direction: column; align-items: stretch; }

    /* Form row (label + control + unit) */
    .form-row {
      display: grid;
      grid-template-columns: 180px 88px 1fr;
      align-items: center;
      gap: 18px;
      padding: 7px 0;
    }
    .form-row .row-label {
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }
    .form-row .unit {
      font-size: 11px;
      color: var(--ink-dimer);
    }
    /* Wide control that spans the unit + control columns of .form-row */
    .form-row .row-wide {
      grid-column: 2 / span 2;
      min-width: 0;
    }

    /* Bordered form section (used to group related rows — e.g. an LLM provider) */
    .form-sect {
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 22px 28px;
      margin-bottom: 10px;
    }

    /* ───────────────────────────────────────────────────────────────── */
    /* BUTTON                                                           */
    /* ───────────────────────────────────────────────────────────────── */
    .btn {
      font: inherit;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink);
      background: var(--panel-2);
      border: 1px solid var(--line);
      padding: 8px 16px;
      cursor: pointer;
      transition: background .12s, border-color .12s, color .12s, transform .04s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      user-select: none;
      line-height: 1;
      border-radius: 0;
    }
    .btn:hover  { background: #1c242c; border-color: #2e3942; }
    .btn:active { transform: translateY(1px); }
    .btn:focus-visible {
      outline: none;
      border-color: var(--a);
      box-shadow: 0 0 0 2px rgba(242,164,75,0.18);
    }
    .btn[disabled] {
      color: var(--ink-faint);
      background: var(--panel);
      border-color: var(--line-soft);
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--a);
      color: var(--a-ink);
      border-color: var(--a);
      font-weight: 600;
    }
    .btn-primary:hover { background: #ffb75c; border-color: #ffb75c; }
    .btn-primary:focus-visible { box-shadow: 0 0 0 2px rgba(242,164,75,0.30); }

    .btn-ghost {
      background: transparent;
      border-color: transparent;
      color: var(--ink-dim);
    }
    .btn-ghost:hover { background: var(--panel-2); color: var(--ink); border-color: transparent; }

    .btn-danger {
      color: var(--err);
      border-color: rgba(255,107,107,0.30);
    }
    .btn-danger:hover { background: rgba(255,107,107,0.08); border-color: var(--err); }

    .btn-sm { padding: 5px 10px;  font-size: 10px; }
    .btn-lg { padding: 11px 20px; font-size: 13px; }

    .btn-icon {
      padding: 7px;
      min-width: 30px;
      justify-content: center;
    }
    .btn-icon svg { width: 14px; height: 14px; display: block; }

    /* Bracket link — "[ Reset section ]" style */
    .btn-link {
      background: none;
      border: none;
      font: inherit;
      color: var(--a);
      cursor: pointer;
      font-size: 12px;
      padding: 2px 0;
      letter-spacing: 0;
      text-transform: none;
    }
    .btn-link:hover { text-decoration: underline; }
    .btn-link::before { content: "[ "; color: var(--ink-dimer); }
    .btn-link::after  { content: " ]"; color: var(--ink-dimer); }

    /* ───────────────────────────────────────────────────────────────── */
    /* INPUT                                                            */
    /* ───────────────────────────────────────────────────────────────── */
    .ipt {
      font: inherit;
      font-size: 13px;
      color: var(--ink);
      background: #070a0d;
      border: 1px solid var(--line);
      padding: 7px 10px;
      width: 100%;
      min-width: 0;
      outline: none;
      border-radius: 0;
      transition: border-color .12s, box-shadow .12s;
    }
    .ipt:hover { border-color: #2e3942; }
    .ipt:focus { border-color: var(--a); box-shadow: inset 0 0 0 1px var(--a); }
    .ipt::placeholder { color: var(--ink-faint); }
    .ipt[disabled] { color: var(--ink-faint); background: var(--panel); cursor: not-allowed; }
    .ipt.invalid { border-color: var(--err); }
    .ipt.invalid:focus { box-shadow: inset 0 0 0 1px var(--err); }

    .ipt-num { text-align: right; font-variant-numeric: tabular-nums; }

    /* Checkbox variant — strips the .ipt chrome (border / padding / full width)
       that's designed for text inputs and lets the native checkbox sit naturally
       in the row. Sized up modestly for visibility in the dense config form. */
    .ipt-check {
      width: 16px;
      min-width: 16px;
      height: 16px;
      padding: 0;
      margin: 0;
      border: 0;
      background: transparent;
      accent-color: var(--a);
      cursor: pointer;
    }
    .ipt-check:focus { box-shadow: 0 0 0 2px var(--a); outline: none; }

    /* Input with inline leading icon */
    .ipt-wrap {
      position: relative;
      display: inline-flex;
      align-items: stretch;
      width: 100%;
    }
    .ipt-wrap > .ipt { padding-left: 30px; }
    .ipt-wrap > .affix {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--ink-dimer);
      font-size: 12px;
      pointer-events: none;
      display: flex;
    }
    .ipt-wrap > .affix svg { width: 13px; height: 13px; }

    /* Input with trailing button cluster (e.g. secret reveal/clear).
       Uses flex so any number of trailing .ipt-btn children sit inline. */
    .ipt-cluster {
      display: flex;
      align-items: stretch;
    }
    .ipt-cluster .ipt {
      border-right: none;
      flex: 1;
      min-width: 0;
    }
    .ipt-cluster .ipt-btn {
      font: inherit;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-dim);
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 0 12px;
      cursor: pointer;
      flex-shrink: 0;
      white-space: nowrap;
      transition: color .12s, background .12s;
    }
    .ipt-cluster .ipt-btn:hover:not(:disabled) { color: var(--ink); background: var(--panel-2); }
    .ipt-cluster .ipt-btn:disabled { color: var(--ink-faint); cursor: not-allowed; }
    .ipt-cluster .ipt-btn + .ipt-btn { border-left: none; }

    /* Textarea */
    textarea.ipt { resize: vertical; min-height: 80px; line-height: 1.5; }

    /* Field (label above) */
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }
    .field .lbl {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }
    .field .help {
      font-size: 11px;
      color: var(--ink-dimer);
    }
    .field .help.err { color: var(--err); }

    /* ───────────────────────────────────────────────────────────────── */
    /* SELECT / DROPDOWN                                                */
    /* ───────────────────────────────────────────────────────────────── */
    .sel {
      font: inherit;
      font-size: 13px;
      color: var(--ink);
      background: #070a0d;
      border: 1px solid var(--line);
      padding: 7px 28px 7px 10px;
      width: 100%;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      border-radius: 0;
      background-image: linear-gradient(45deg, transparent 50%, var(--ink-dim) 50%),
                        linear-gradient(135deg, var(--ink-dim) 50%, transparent 50%);
      background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
      outline: none;
      transition: border-color .12s, box-shadow .12s;
    }
    .sel:hover { border-color: #2e3942; }
    .sel:focus { border-color: var(--a); box-shadow: inset 0 0 0 1px var(--a); }
    .sel[disabled] { color: var(--ink-faint); background-color: var(--panel); cursor: not-allowed; }

    /* Custom combobox */
    .combo {
      position: relative;
      width: 100%;
    }
    .combo-button {
      font: inherit;
      font-size: 13px;
      color: var(--ink);
      background: #070a0d;
      border: 1px solid var(--line);
      padding: 7px 10px;
      width: 100%;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      outline: none;
      border-radius: 0;
    }
    .combo-button .caret { color: var(--ink-dim); font-size: 9px; }
    .combo.open .combo-button { border-color: var(--a); box-shadow: inset 0 0 0 1px var(--a); }
    .combo-menu {
      position: absolute;
      top: calc(100% - 1px);
      left: 0;
      right: 0;
      background: #070a0d;
      border: 1px solid var(--a);
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
      z-index: 10;
      max-height: 220px;
      overflow: auto;
    }
    .combo-option {
      padding: 8px 10px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--ink);
    }
    .combo-option .mono-dim { color: var(--ink-dimer); font-size: 11px; }
    .combo-option:hover { background: var(--panel-2); }
    .combo-option.active { background: rgba(242,164,75,0.12); color: var(--a); }
    .combo-option.active::before { content: "› "; margin-left: -6px; }

    /* ───────────────────────────────────────────────────────────────── */
    /* CHECKBOX / RADIO                                                 */
    /* ───────────────────────────────────────────────────────────────── */
    .chk, .rdo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      font-size: 13px;
      color: var(--ink);
    }
    .chk input, .rdo input { position: absolute; opacity: 0; pointer-events: none; }
    .chk .box, .rdo .dot {
      width: 14px;
      height: 14px;
      background: #070a0d;
      border: 1px solid var(--line);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color .12s, background .12s;
    }
    .rdo .dot { border-radius: 50%; }
    .chk:hover .box, .rdo:hover .dot { border-color: #39454f; }
    .chk input:checked + .box {
      border-color: var(--a);
      background: var(--a);
    }
    .chk input:checked + .box::after {
      content: "";
      width: 8px;
      height: 4px;
      border-left: 1.5px solid var(--a-ink);
      border-bottom: 1.5px solid var(--a-ink);
      transform: rotate(-45deg) translate(1px, -1px);
    }
    .rdo input:checked + .dot { border-color: var(--a); }
    .rdo input:checked + .dot::after {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--a);
    }
    .chk input:focus-visible + .box,
    .rdo input:focus-visible + .dot {
      box-shadow: 0 0 0 2px rgba(242,164,75,0.25);
    }

    /* ───────────────────────────────────────────────────────────────── */
    /* TOGGLE                                                           */
    /* ───────────────────────────────────────────────────────────────── */
    .tgl {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      font-size: 13px;
    }
    .tgl input { position: absolute; opacity: 0; pointer-events: none; }
    .tgl .track {
      width: 34px;
      height: 18px;
      background: #070a0d;
      border: 1px solid var(--line);
      position: relative;
      flex-shrink: 0;
      transition: background .15s, border-color .15s;
    }
    .tgl .track::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 12px;
      height: 12px;
      background: var(--ink-dim);
      transition: transform .15s, background .15s;
    }
    .tgl input:checked + .track {
      background: rgba(242,164,75,0.15);
      border-color: var(--a);
    }
    .tgl input:checked + .track::after {
      transform: translateX(16px);
      background: var(--a);
    }

    /* ───────────────────────────────────────────────────────────────── */
    /* TABS / SEGMENTED                                                 */
    /* ───────────────────────────────────────────────────────────────── */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--line);
      gap: 0;
    }
    .tab {
      font: inherit;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-dim);
      background: none;
      border: none;
      padding: 14px 28px;
      cursor: pointer;
      flex: 1;
      text-align: center;
      position: relative;
      transition: color .12s;
    }
    .tab:hover { color: var(--ink); }
    .tab.active { color: var(--ink); }
    .tab.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2px;
      background: var(--a);
    }

    /* Segmented control — boxy */
    .seg {
      display: inline-flex;
      border: 1px solid var(--line);
      background: #070a0d;
    }
    .seg button {
      font: inherit;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ink-dim);
      background: none;
      border: none;
      padding: 7px 14px;
      cursor: pointer;
      border-right: 1px solid var(--line);
      transition: color .12s, background .12s;
    }
    .seg button:last-child { border-right: none; }
    .seg button:hover { color: var(--ink); }
    .seg button.on,
    .seg button.active {
      color: var(--a-ink);
      background: var(--a);
    }

    /* ───────────────────────────────────────────────────────────────── */
    /* SLIDER / STEPPER                                                 */
    /* ───────────────────────────────────────────────────────────────── */
    .sldr {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 2px;
      background: var(--line);
      outline: none;
      cursor: pointer;
    }
    .sldr::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 16px;
      background: var(--a);
      cursor: grab;
      border-radius: 0;
      border: 1px solid var(--a);
    }
    .sldr::-moz-range-thumb {
      width: 12px;
      height: 16px;
      background: var(--a);
      cursor: grab;
      border-radius: 0;
      border: 1px solid var(--a);
    }

    .stp {
      display: inline-flex;
      align-items: stretch;
      border: 1px solid var(--line);
      background: #070a0d;
    }
    .stp button {
      font: inherit;
      font-size: 14px;
      color: var(--ink-dim);
      background: none;
      border: none;
      width: 26px;
      cursor: pointer;
      transition: color .12s, background .12s;
    }
    .stp button:hover { color: var(--a); background: var(--panel-2); }
    .stp input {
      font: inherit;
      font-size: 13px;
      color: var(--ink);
      background: none;
      border: none;
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      text-align: center;
      width: 48px;
      outline: none;
      font-variant-numeric: tabular-nums;
    }

    /* ───────────────────────────────────────────────────────────────── */
    /* BADGES / STATUS DOTS / KBD / TOOLTIP / BANNER / PROGRESS         */
    /* ───────────────────────────────────────────────────────────────── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 3px 8px;
      border: 1px solid var(--line);
      color: var(--ink-dim);
      background: var(--panel);
      line-height: 1.4;
    }
    .badge.ok     { color: var(--ok);   border-color: rgba(110,227,165,0.30); }
    .badge.warn   { color: var(--warn); border-color: rgba(242,164,75,0.35); }
    .badge.err    { color: var(--err);  border-color: rgba(255,107,107,0.35); }
    .badge.accent { color: var(--b);    border-color: rgba(176,140,255,0.35); }
    .badge.solid  { color: var(--a-ink); background: var(--a); border-color: var(--a); }

    .dot-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--ink-dim);
    }
    .dot-status::before {
      content: "";
      width: 7px;
      height: 7px;
      background: currentColor;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-status.ok   { color: var(--ok); }
    .dot-status.warn { color: var(--warn); }
    .dot-status.err  { color: var(--err); }
    .dot-status.idle { color: var(--ink-dimer); }

    .kbd {
      font-family: var(--font);
      font-size: 10px;
      padding: 2px 6px;
      border: 1px solid var(--line);
      border-bottom-width: 2px;
      background: var(--panel);
      color: var(--ink-dim);
      line-height: 1;
      display: inline-block;
    }

    .tip-wrap { position: relative; display: inline-block; }
    .tip-wrap .tip {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: var(--ink);
      background: #070a0d;
      border: 1px solid var(--a);
      padding: 5px 9px;
      white-space: nowrap;
      pointer-events: none;
    }
    .tip-wrap .tip::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 4px solid transparent;
      border-top-color: var(--a);
    }

    .banner {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 12px 16px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-left: 3px solid var(--ink-dim);
      font-size: 12px;
      line-height: 1.5;
    }
    .banner .b-mark {
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--ink-dim);
      padding-top: 1px;
    }
    .banner.ok   { border-left-color: var(--ok); }
    .banner.ok .b-mark   { color: var(--ok); }
    .banner.warn { border-left-color: var(--warn); }
    .banner.warn .b-mark { color: var(--warn); }
    .banner.err  { border-left-color: var(--err); }
    .banner.err .b-mark  { color: var(--err); }

    .prog {
      width: 100%;
      height: 4px;
      background: var(--line);
      position: relative;
    }
    .prog .bar {
      height: 100%;
      background: var(--a);
    }
    .prog-label {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ink-dim);
      margin-bottom: 6px;
    }

    /* Breadcrumb */
    .bc {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--ink-dim);
    }
    .bc a { color: var(--ink-dim); text-decoration: none; cursor: pointer; }
    .bc a:hover { color: var(--a); }
    .bc .sep  { color: var(--ink-faint); }
    .bc .here { color: var(--ink); }

    /* Table */
    .tbl {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .tbl th, .tbl td {
      text-align: left;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }
    .tbl tbody tr:last-child td { border-bottom: none; }
    .tbl th {
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-dim);
      font-weight: 500;
      background: var(--panel-2);
    }
    .tbl td { color: var(--ink); }
    .tbl .num { font-variant-numeric: tabular-nums; text-align: right; }
    .tbl tr:hover td { background: rgba(255,255,255,0.02); }
    /* Right-most action column — small, icon-button-shaped, no extra padding. */
    .tbl .cell-action { width: 50px; padding: 4px 8px; text-align: right; }

    /* Footer strip below a .tbl (for "+ Add row" buttons etc.). Pair with
       `.ap-panel` style="padding:0" so the footer sits flush with the table. */
    .tbl-footer {
      padding: 12px 14px;
      border-top: 1px solid var(--line);
    }

    /* Compact form controls sized to fit inside a .tbl cell. The standard .ipt
       is 32px+ tall and full-width; .ipt-cell shrinks both so the table stays
       data-density-appropriate without losing the design-system input chrome
       (background, border, focus ring). */
    .ipt-cell {
      padding: 4px 8px;
      font-size: 12px;
      width: 60px;
      text-align: right;
    }
    .sel-cell {
      width: 80px;
      padding: 4px 22px 4px 8px;
      font-size: 12px;
    }

    /* ───────────────────────────────────────────────────────────────── */
    /* LIST PATTERN (matches list / strategies list / config list)      */
    /* ───────────────────────────────────────────────────────────────── */
    /* Action bar at the top of a list view: primary CTA on the left,
       count / secondary text on the right. */
    .list-action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      padding: 0 24px;
      border-bottom: 1px solid var(--line);
      background: var(--bg);
      flex-shrink: 0;
    }
    /* The list-action-bar's primary CTA is intentionally taller than the default
       .btn (32px) — gives it presence as the page's primary action. */
    .list-action-bar > .btn-primary { padding: 10px 16px; }

    .list-count {
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }

    /* Scrollable list body. Sized to fill the remaining height of its parent
       (assumes parent is a flex column with a 60px action bar above). */
    .list-body {
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }

    /* Each row in the list. Two-line content + trailing action buttons. */
    .list-row {
      display: flex;
      align-items: center;
      min-height: 60px;
      padding: 12px 24px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      transition: background .12s;
    }
    .list-row:hover { background: var(--panel-2); }
    .list-row.skeleton {
      cursor: default;
      color: var(--ink-dimer);
    }
    .list-row.skeleton:hover { background: var(--panel); }

    .list-row-content { flex: 1; min-width: 0; }

    .list-row-line-1 {
      font-size: 12px;
      font-weight: 500;
      color: var(--ink);
      margin-bottom: 4px;
      letter-spacing: 0.04em;
    }

    .list-row-line-2 {
      font-size: 10px;
      color: var(--ink-dim);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .list-row-actions {
      display: flex;
      gap: 8px;
      margin-left: 16px;
    }

    /* Empty / error states centered inside .list-body */
    .list-empty-state,
    .list-error {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      padding: 48px 24px;
    }

    /* ───────────────────────────────────────────────────────────────── */
    /* UTILITIES                                                        */
    /* ───────────────────────────────────────────────────────────────── */
    .mono  { font-family: var(--font); }
    .disp  { font-family: var(--font-disp); }
    .dim   { color: var(--ink-dim); }
    .dimer { color: var(--ink-dimer); }
    .tabular { font-variant-numeric: tabular-nums; }

    /* ── INLINE: app.css ── */
    /* Agent Pitch — Broadcast Viewer
       Production stylesheet. Adapted from prototypes/ui/viewer.css
       to vanilla DOM (no React) and to the live API data shape.

       Tokens that overlap design-system.css are owned by the design system;
       this file declares only viewer-specific extras (--pitch*, --live,
       --neutral, --amber, --bad, broadcast typography aliases).
       ────────────────────────────────────────────────────────── */

    :root {
      /* Pitch render */
      --pitch:     #1e3a2a;
      --pitch-2:   #214030;
      --pitch-line:#e8edf1;

      /* Broadcast accents (not in the components system) */
      --live:      #ff3b4a;
      --neutral:   #6ea8ff;
      --amber:     #f2c14b;

      /* Aliases for legacy viewer rules */
      --bad:       var(--err);    /* alias the design-system token, not a copy */
    }

    html, body {
      font-size: 13px;
      line-height: 1.45;
      overflow: hidden;
      height: 100%;
    }

    /* ── App shell ──────────────────────────────────────────── */
    .app {
      display: grid;
      /* Chyron 80px gives the team-ident's three lines (badge / name / model)
         room to breathe without the model line clipping. */
      grid-template-rows: 80px minmax(0, 1fr) 22px;
      height: 100vh;
      width: 100vw;
    }

    /* ── Top scoreboard chyron ──────────────────────────────── */
    .chyron {
      display: grid;
      /* brand | score | live stats (POSS / CARRIER) | clock | stats toggle */
      grid-template-columns: 220px minmax(0, 1fr) auto 200px auto;
      align-items: stretch;
      background: #000;
      border-bottom: 1px solid var(--line);
      min-width: 0;
    }
    .chyron-brand {
      display: flex; align-items: center; gap: 10px;
      padding: 0 18px;
      border-right: 1px solid var(--line);
      background: linear-gradient(180deg, #0d1216, #05080a);
    }
    .brand-mark {
      font-family: var(--font-disp);
      font-weight: 900; font-style: italic;
      font-size: 26px;
      letter-spacing: -0.02em;
      color: var(--ink);
      position: relative;
      line-height: 1;
      display: inline-flex; align-items: center; gap: 3px;
    }
    .brand-mark .dot {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--a);
      box-shadow: 0 0 10px var(--a);
      transform: translateY(5px);
    }
    .brand-meta {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--ink-dim);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      line-height: 1.35;
      min-width: 0;
    }
    .brand-meta b { color: var(--ink); font-weight: 600; }
    .brand-meta div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* Match-id line is the dominant identifier in the chyron now (no logo+wordmark
       competing for attention). Bump it slightly so the eye lands here first. */
    .chyron .match-title-line { font-size: 12px; letter-spacing: 0.04em; text-transform: none; }
    .chyron .match-title-line b { color: var(--ink); }

    /* Center score block */
    .score-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }
    .team-block {
      display: flex; align-items: center; gap: 14px;
      padding: 0 18px;
      height: 100%;
    }
    .team-block.home { justify-content: flex-end; }
    /* row-reverse mirrors the home block (swatch sits adjacent to the
       score, ident on the outside). With row-reverse the main axis is
       reversed, so flex-end packs items at the visual LEFT of the column
       — i.e. snug against the score plate, mirroring the home side. */
    .team-block.away { justify-content: flex-end; flex-direction: row-reverse; }
    .team-swatch {
      width: 6px; height: 36px; border-radius: 1px;
    }
    .team-swatch.a { background: var(--a); box-shadow: 0 0 18px -4px var(--a); }
    .team-swatch.b { background: var(--b); box-shadow: 0 0 18px -4px var(--b); }
    .team-ident {
      display: flex; flex-direction: column; gap: 1px;
      text-align: right;
      align-items: flex-end;  /* prevent badge box from stretching to column width */
      min-width: 0;            /* allow long .model text to shrink/wrap inside flex */
    }
    .team-block.away .team-ident {
      text-align: left;
      align-items: flex-start;
    }
    .team-ident .badge {
      font-family: var(--font-disp);
      font-weight: 700; font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--ink-dim);
      text-transform: uppercase;
    }
    .team-ident .name {
      font-family: var(--font-disp);
      font-weight: 700; font-size: 19px;
      letter-spacing: -0.01em;
      color: var(--ink);
      line-height: 1.1;
    }
    .team-ident .model {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--ink-dimer);
      letter-spacing: 0.04em;
      /* long generated-strategy file stems (e.g. anthropic-claude-sonnet-...
         -<timestamp>) otherwise blow out the chyron column. */
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .score-plate {
      display: grid;
      grid-template-columns: auto auto auto;
      align-items: center;
      gap: 14px;
      padding: 0 16px;
      height: 100%;
      background: #000;
      position: relative;
    }
    .score-num {
      font-family: var(--font-disp);
      font-weight: 700;
      font-size: 36px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      min-width: 28px;
      text-align: center;
      letter-spacing: -0.02em;
    }
    .score-num.a { color: var(--a); text-shadow: 0 0 24px rgba(242,164,75,0.35); }
    .score-num.b { color: var(--b); text-shadow: 0 0 24px rgba(176,140,255,0.35); }
    .score-sep {
      color: var(--ink-dimer);
      font-family: var(--font-disp);
      font-weight: 400;
      font-size: 26px;
    }
    .clock-bar {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 0 18px;
      border-left: 1px solid var(--line);
      background: linear-gradient(180deg, #0d1216, #05080a);
    }
    .clock {
      font-family: var(--font-disp);
      font-weight: 700;
      font-size: 24px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      text-align: right;
      color: var(--ink);
    }
    .clock .total { color: var(--ink-dimer); font-size: 14px; font-weight: 500; }
    .live-pip {
      display: flex; align-items: center; gap: 6px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.22em;
      color: var(--live);
      text-transform: uppercase;
      font-weight: 700;
    }
    .live-pip .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--live);
      box-shadow: 0 0 12px var(--live);
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.35; transform: scale(0.75); }
    }

    /* ── Body grid: pitch | events ──────────────────────────── */
    .body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      transition: grid-template-columns 180ms ease;
      /* `flex: 1` + `min-height: 0` makes .body fill the remaining vertical
         space inside #section-matches (a flex column with the 80px chyron
         above + the 22px status-bar below). Without this, .body sizes to its
         content (the canvas + scrub) — and since the canvas's aspect-ratio
         wants to grow huge on wide viewports, the content overflowed and got
         clipped by `overflow: hidden`, hiding the bottom of the field. */
      flex: 1;
      min-height: 0;
      background: var(--bg);
      overflow: hidden;
    }
    .pitch-wrap {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      min-height: 0;
    }
    .pitch-stage {
      position: relative;
      min-height: 220px;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 45%, #254633 0%, #182e22 55%, #0d1a13 100%);
      display: grid;
      place-items: center;
      /* Explicit padding so the canvas (centered via place-items) physically
         can't reach the bottom edge — guarantees a visible gap to the scrub
         bar below regardless of viewport size or pitch aspect-ratio. The
         canvas's own max-height further constrains this. */
      padding: 16px 0 24px;
    }

    /* "Waiting for match result" overlay — covers the canvas while the engine
       subprocess is starting and no events.jsonl exists yet. Hidden once data
       arrives (handled by app.js). */
    .match-waiting-overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 13, 16, 0.92);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 24px;
      text-align: center;
    }
    .match-waiting-overlay[hidden] {
      display: none;
    }
    .match-waiting-overlay .waiting-spinner {
      font-size: 32px;
      color: var(--ink-dim);
      font-family: monospace;
      /* Gentle breathing animation — the only motion we tolerate here, conveys "alive" */
      animation: waiting-pulse 1.4s ease-in-out infinite;
    }
    @keyframes waiting-pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    .match-waiting-overlay .waiting-title {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 500;
      color: var(--ink);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .match-waiting-overlay .waiting-subtitle {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--ink-dim);
      letter-spacing: 0.06em;
    }
    .match-waiting-overlay .waiting-hint {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-dimer);
      margin-top: 8px;
      max-width: 380px;
      line-height: 1.5;
    }
    @media (prefers-reduced-motion: reduce) {
      .match-waiting-overlay .waiting-spinner {
        animation: none;
      }
    }
    #field-canvas {
      position: relative;
      display: block;
      /* Display size is set inline by app.js _resizeCanvas() — JS reads
         pitch-stage's available area, computes a fit-within size that respects
         the per-match aspect ratio (FIELD_W/FIELD_H from meta), and writes
         style.width / style.height. Removes the CSS aspect-ratio + max-*
         trio that was causing overflow into the scrub bar on certain viewport
         sizes (the constraints could pick a height larger than fit). */
    }

    /* Live-stats column inside the chyron — POSSESSION + CARRIER. */
    .chyron-stats {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 18px;
      border-left: 1px solid var(--line);
      background: linear-gradient(180deg, #0d1216, #05080a);
    }
    .chyron-stats .stat-cell {
      display: flex; flex-direction: column; gap: 2px;
      text-align: left;
      min-width: 70px;
    }
    .chyron-stats .stat-cell label {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-dimer);
    }
    .chyron-stats .stat-cell .big {
      font-family: var(--font-disp);
      font-weight: 700;
      font-size: 18px;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
      letter-spacing: -0.01em;
    }

    /* Goal flash + chyron */
    .goal-flash {
      position: absolute; inset: 0;
      background:
        radial-gradient(circle at var(--fx, 50%) 50%,
          rgba(242,164,75,0.35) 0%,
          rgba(242,164,75,0) 45%);
      pointer-events: none;
      animation: flash 1.8s ease-out;
      z-index: 3;
    }
    .goal-flash.b {
      background:
        radial-gradient(circle at var(--fx, 50%) 50%,
          rgba(176,140,255,0.35) 0%,
          rgba(176,140,255,0) 45%);
    }
    @keyframes flash {
      0%   { opacity: 0; }
      15%  { opacity: 1; }
      100% { opacity: 0; }
    }
    .goal-chyron {
      position: absolute;
      left: 50%;
      top: 38%;
      transform: translate(-50%, -50%);
      padding: 18px 32px;
      background: #000;
      border: 1px solid var(--line-2);
      pointer-events: none;
      animation: goalPop 1.8s cubic-bezier(0.22, 1.0, 0.36, 1.0);
      font-family: var(--font-disp);
      z-index: 4;
    }
    .goal-chyron .word {
      font-weight: 700;
      font-size: 56px;
      letter-spacing: 0.04em;
      line-height: 1;
    }
    .goal-chyron .word.a { color: var(--a); }
    .goal-chyron .word.b { color: var(--b); }
    .goal-chyron .sub {
      margin-top: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-dim);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    @keyframes goalPop {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
      15%  { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
      85%  { opacity: 1; transform: translate(-50%, -50%) scale(1.0); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.0); }
    }

    /* ── Scrubber ────────────────────────────────────────────── */
    .scrub {
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      align-items: center;
      gap: 14px;
      padding: 10px 20px;
      background: var(--panel);
      border-top: 1px solid var(--line);
    }
    /* Scrubber's play/pause icon button. Distinct from the design-system
       .btn (uppercase action button) — this one is a 32px square icon. */
    .scrub-btn {
      width: 32px; height: 32px;
      border: 1px solid var(--line-2);
      background: var(--panel-2);
      color: var(--ink);
      display: grid; place-items: center;
      cursor: pointer;
      font-family: var(--font-disp);
      font-size: 14px;
      transition: background 120ms;
    }
    .scrub-btn:hover { background: var(--panel-3); }
    .scrub-btn.play { width: 38px; height: 38px; }
    .scrub-track {
      position: relative;
      height: 14px;
      cursor: pointer;
      display: flex; align-items: center;
    }
    .scrub-track::before {
      content: ""; position: absolute; left: 0; right: 0; top: 4px; height: 6px;
      background: var(--panel-3); border: 1px solid var(--line);
      pointer-events: none;
    }
    .scrub-fill {
      position: absolute;
      left: 0; top: 4px;
      height: 6px;
      background: linear-gradient(90deg, var(--a), var(--b));
      pointer-events: none;
    }
    .scrub-markers { position: absolute; inset: 0; pointer-events: none; }
    .scrub-marker {
      position: absolute;
      top: -2px;
      width: 2px; height: 18px;
      background: var(--ink-dimer);
      opacity: 0.6;
    }
    .scrub-marker.goal.a { background: var(--a); opacity: 1; box-shadow: 0 0 6px var(--a); }
    .scrub-marker.goal.b { background: var(--b); opacity: 1; box-shadow: 0 0 6px var(--b); }
    /* Native range overlays the track but stays transparent — captures input */
    #scrub-bar {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      margin: 0; padding: 0;
      background: transparent;
      -webkit-appearance: none; appearance: none;
      cursor: pointer;
      z-index: 2;
    }
    #scrub-bar::-webkit-slider-runnable-track { background: transparent; height: 14px; }
    #scrub-bar::-moz-range-track { background: transparent; height: 14px; }
    #scrub-bar::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 4px; height: 18px; margin-top: -2px;
      background: var(--ink); border: none; border-radius: 1px;
      cursor: grab;
    }
    #scrub-bar::-moz-range-thumb {
      width: 4px; height: 18px;
      background: var(--ink); border: none; border-radius: 1px;
      cursor: grab;
    }

    .tick-count {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-dim);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.06em;
      min-width: 110px;
      text-align: right;
    }
    .speed-pill {
      display: flex; gap: 0;
      border: 1px solid var(--line-2);
      height: 32px;
    }
    .speed-pill button {
      background: var(--panel-2);
      border: none;
      border-right: 1px solid var(--line-2);
      color: var(--ink-dim);
      padding: 0 10px;
      font-family: var(--font-mono);
      font-size: 11px;
      cursor: pointer;
      min-width: 36px;
    }
    .speed-pill button:last-child { border-right: none; }
    .speed-pill button.active { background: var(--ink); color: #000; }

    /* ── Event ticker (right column) ────────────────────────── */
    .events {
      background: var(--panel);
      border-left: 1px solid var(--line);
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 0;
      overflow: hidden;
    }
    .events-head {
      display: grid;

    /* Event-feed segmented filter — sized down to fit the 320px column.

    .events-list {

    .events-list::-webkit-scrollbar-thumb { background: var(--line-2); }

    .evt {
      display: grid;

      padding: 5px 14px;

      border-left: 2px solid transparent;
      cursor: pointer;
      transition: background 100ms;
    }
    .evt:hover { background: var(--panel-2); }

    .evt.proximity { border-left-color: var(--ink-dim); }
    .evt .t {
      color: var(--ink-dimer);
      font-size: 10px;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .evt .ico { font-size: 13px; text-align: center; }
    .evt .txt { color: var(--ink); letter-spacing: 0.01em; word-break: break-word; }
    .evt.placeholder {
      color: var(--ink-dimer);
      font-style: italic;
      cursor: default;
      display: block;
      padding: 12px 14px;
    }

    /* Event-kind colouring (matches old ev-* class taxonomy) */
    .evt.ev-goal           .ico { color: var(--amber); }
    .evt.ev-goal           .txt { color: var(--amber); font-weight: 700; }
    .evt.ev-shot           .ico { color: var(--a); }
    .evt.ev-pass           .ico { color: var(--neutral); }
    .evt.ev-pickup         .ico { color: var(--ink-dim); }
    .evt.ev-pickup-bad     .ico { color: var(--ink-dimer); }
    .evt.ev-pickup-bad     .txt { color: var(--ink-dimer); font-style: italic; }
    .evt.ev-tackle         .ico { color: var(--bad); }
    .evt.ev-tackle-good    .ico { color: var(--bad); }
    .evt.ev-tackle-good    .txt { font-weight: 600; }
    .evt.ev-tackle-blocked .ico { color: var(--bad); }
    .evt.ev-tackle-blocked .txt { color: #d8b888; font-style: italic; }
    .evt.ev-save           .ico { color: var(--ok); }
    .evt.ev-save-blocked   .ico { color: var(--ok); }
    .evt.ev-save-blocked   .txt { color: #b8d8a8; font-style: italic; }
    .evt.ev-deflection     .ico { color: var(--amber); }
    .evt.ev-deflection     .txt { color: #f0e890; }
    .evt.ev-dribble-good   .ico { color: var(--b); }
    .evt.ev-dribble-good   .txt { color: #f0d090; font-weight: 500; }
    .evt.ev-dribble-bad    .ico { color: var(--b); }
    .evt.ev-dribble-bad    .txt { color: #b89860; font-style: italic; }
    .evt.ev-blocked        .ico { color: var(--ink-dimer); }
    .evt.ev-blocked        .txt { color: var(--ink-dimer); font-style: italic; }
    .evt.ev-oob            .ico { color: var(--ink-dim); }
    .evt.ev-oob            .txt { color: var(--ink-dim); font-style: italic; }
    .evt.ev-offside        .ico { color: var(--bad); }
    .evt.ev-offside        .txt { color: #d8a8a8; font-weight: 600; }
    .evt.ev-foul           .ico { color: var(--bad); }
    .evt.ev-foul           .txt { color: #e0b0a0; font-weight: 600; }
    .evt.ev-card-yellow    .txt { color: #f0d24a; font-weight: 700; }
    .evt.ev-card-red       .txt { color: #ff6b5e; font-weight: 800; text-transform: uppercase; }
    .evt.ev-penalty        .ico { color: var(--amber); }
    .evt.ev-penalty        .txt { color: var(--amber); font-weight: 700; }

    .evt.ev-freekick       .txt { color: #a8d8b0; font-weight: 500; }

    .evt.ev-phase          .txt { color: #c8b8e0; font-weight: 500; }

    .evt.ev-phase-major    .txt { color: var(--amber); font-weight: 700; text-transform: uppercase; }

    .evt .team-tag {

    /* ── Status bar ─────────────────────────────────────────── */

      background: #000;

    /* ── INLINE: match-stats.css ── */
    /* ─────────────────────────────────────────────────────────────────
       Agent Pitch — Match Statistics Panel
       Uses design-system.css tokens exclusively. No new custom properties.
       ───────────────────────────────────────────────────────────────── */

    /* ── Trigger button (in chyron, persistent toggle) ── */
    .chyron-stats-toggle {

      text-align: left;
      padding-left: 0;
    }
    .stats-player-table td {
      padding: 2px 8px 2px 0;
      border-bottom: 1px solid var(--line-soft);
      color: var(--ink);

      font-variant-numeric: tabular-nums;

    .stats-player-table td:first-child,
    .stats-player-table td:nth-child(2) {

    /* ── Status bar (shell.css not included) ── */
    .status-bar {
      display: flex; align-items: center; gap: 16px;

      background: var(--panel); border-top: 1px solid var(--line);

    #loader-error {
      color: var(--err); font-size: 12px;
      display: none;
    }
    #loader-error.visible { display: block; }
  </style>
</head>
<body>

<!-- ── Loader overlay (hidden when BUNDLED_MATCH present or after folder selected) ── -->
<div id="loader-screen">
  <div class="loader-brand">A<span class="dot">·</span>P  AGENT PITCH</div>

<!-- ── Match Viewer (same DOM structure as index.html #section-matches) ── -->

<script>
'use strict';
/**
 * JS port of src/api/http_server/match_stats.py::compute_match_stats.
 * Pure function: takes parsed events array + meta dict, returns stats dict.
 */
function computeMatchStats(events, meta) {
  // Build roster: { player_id: { team, name, role, number } }
  const roster = {};
  for (const [teamId, teamData] of Object.entries(meta.teams || {})) {
    const players = Array.isArray(teamData) ? teamData : (teamData?.roster || []);
    for (const p of players) {
      if (p.player_id) {
        roster[p.player_id] = {
          team: teamId,
          name: p.name || '',
          role: p.role || '',
          number: p.number || 0,
        };
      }
    }
  }

  // Team stats template
  function emptyTeam() {
    return {
      possession_pct: 50.0, goals: 0, assists: 0, shots: 0, shots_on_target: 0,
      passes_attempted: 0, tackles_attempted: 0, tackles_successful: 0,
      dribbles_attempted: 0, dribbles_successful: 0, callback_failures: 0,
      oob_corners: 0, oob_throw_ins: 0, oob_goal_kicks: 0,
      offsides: 0,
      gk_saves_caught: 0, gk_saves_parried: 0,
      // Issue #38 (IFAB Law 12): fouls, cards, penalties.
      fouls: 0, yellow_cards: 0, red_cards: 0,
      penalties_awarded: 0, penalties_scored: 0,
    };
  }
  // Player stats template
  function emptyPlayer(info) {
    return {
      team: info.team, role: info.role, number: info.number, name: info.name || '',
      goals: 0, assists: 0, shots: 0, shots_on_target: 0,
      passes_attempted: 0, tackles_attempted: 0, tackles_successful: 0,
      dribbles_attempted: 0, dribbles_successful: 0,
      distance_run: 0.0, offsides: 0,
      gk_saves_caught: 0, gk_saves_parried: 0,
      // Issue #38 (IFAB Law 12): fouls committed + cards, keyed per player.
      fouls: 0, yellow_cards: 0, red_cards: 0,
      callback_failures: 0,
    };
  }

  const teamStats = { team_a: emptyTeam(), team_b: emptyTeam() };
  const playerStats = {};
  for (const [pid, info] of Object.entries(roster)) {
    playerStats[pid] = emptyPlayer(info);
  }

  let possA = 0, possB = 0;
  const prevPositions = {};
  // Assist chain tracking (issue #47) — mirrors match_stats.py.
  const assistState = { open_pass: null, armed: null };

  for (const tick of events) {
    // Possession
    const bp = tick.ball_possession;
    if (bp === 'team_a') possA++;
    else if (bp === 'team_b') possB++;

    // Distance run
    for (const [pid, pos] of Object.entries(tick.player_positions || {})) {
      if (!roster[pid]) continue;
      if (prevPositions[pid]) {
        const [px, py] = prevPositions[pid];
        playerStats[pid].distance_run += Math.hypot(pos[0] - px, pos[1] - py);
      }
      prevPositions[pid] = pos;
    }

    // Actions
    for (const rec of (tick.actions || [])) {
      _processAction(rec, teamStats, playerStats, roster, assistState);
    }
  }

  // Possession percentages
  const totalPoss = possA + possB;
  if (totalPoss > 0) {
    teamStats.team_a.possession_pct = 100.0 * possA / totalPoss;
    teamStats.team_b.possession_pct = 100.0 * possB / totalPoss;
  }
  // Round distance
  for (const ps of Object.values(playerStats)) {
    ps.distance_run = Math.round(ps.distance_run * 10) / 10;
  }

  for (const slot of ['team_a', 'team_b']) {
    const td = (meta.teams || {})[slot];
    if (td && !Array.isArray(td)) {
      teamStats[slot].team_id = td.team_id || slot;
      teamStats[slot].name = td.name || (slot === 'team_a' ? 'Team A' : 'Team B');
    } else {
      teamStats[slot].team_id = slot;
      teamStats[slot].name = slot === 'team_a' ? 'Team A' : 'Team B';
    }
  }

  return { match_id: meta.match_id || '', teams: teamStats, players: playerStats };
}

// Tackle results that never engaged the ball — they don't break an assist chain.
const _TACKLE_NO_OP_RESULTS = new Set(
  ['out_of_range', 'no_op_settled', 'no_op_carrier_changed', 'no_op_restart_pending']
);

// Track the pass→shot→goal chain and credit assists (issue #47). Mirrors
// _update_assist_state in src/api/http_server/match_stats.py.
function _updateAssistState(rec, st, teamStats, playerStats, roster) {
  const action = (rec.action || '').toLowerCase();
  const result = (rec.result || '').toLowerCase();
  const details = rec.details || {};

  // System restarts (offside, OOB, foul) break the chain. Penalty goals come
  // through the foul branch, so they never carry an assist.
  if (details.offside || details.out_of_bounds || details.foul) {
    st.open_pass = null; st.armed = null;
    return;
  }

  // Goal (open play) — credit the armed passer iff the armed shot belongs to
  // this scorer and the passer is a different teammate.
  const goalTeam = details.goal_scored;
  if (goalTeam) {
    const scorer = details.scored_by || '';
    const armed = st.armed;
    if (armed && armed.team === goalTeam && armed.shooter === scorer && armed.passer !== scorer) {
      const pinfo = roster[armed.passer];
      if (pinfo && pinfo.team === goalTeam) {
        const ats = teamStats[goalTeam];
        const aps = playerStats[armed.passer];
        if (ats) ats.assists++;
        if (aps) aps.assists++;
      }
    }
    st.open_pass = null; st.armed = null;
    return;
  }

  // A save means a shot missed its mark and the ball changed hands.
  if (details.goalkeeper_save === 'success' || details.goalkeeper_save === 'blocked') {
    st.open_pass = null; st.armed = null;
    return;
  }

  if (action === 'pass') {
    st.open_pass = { passer: rec.player_id || '', team: rec.team || '' };
    st.armed = null;
  } else if (action === 'shoot') {
    const shooter = rec.player_id || '';
    const team = rec.team || '';
    const op = st.open_pass;
    if (op && op.team === team && op.passer !== shooter) {
      st.armed = { shooter, passer: op.passer, team };
    } else {
      st.armed = null;
    }
    st.open_pass = null;
  } else if (action === 'tackle') {
    if (!_TACKLE_NO_OP_RESULTS.has(result)) {
      st.open_pass = null; st.armed = null;
    }
  } else if (action === 'move') {
    if (details.dribble_result != null) {
      st.open_pass = null; st.armed = null;
    }
  }
}

function _processAction(rec, teamStats, playerStats, roster, assistState) {
  if (assistState) _updateAssistState(rec, assistState, teamStats, playerStats, roster);

  const pid    = rec.player_id || '';
  const team   = rec.team || '';
  const action = (rec.action || '').toLowerCase();
  const result = (rec.result || '').toLowerCase();
  const details = rec.details || {};
  const ts = teamStats[team];
  const ps = playerStats[pid];

  // Offside (issue #31) — keyed to the OFFENDING team/player (the
  // restart_team is the opposing side that takes the free kick).
  if (details.offside) {
    const offenderId = details.offender_id || '';
    const offenderTeam = (roster[offenderId] || {}).team || '';
    const ots = teamStats[offenderTeam];
    if (ots) ots.offsides++;
    const ops = playerStats[offenderId];
    if (ops) ops.offsides++;
    return; // system record — skip other counters
  }

  // Foul (issue #38, Law 12) — fouls/cards keyed to the OFFENDING team
  // (the record is a `system` action, so derive the team from the roster);
  // penalties keyed to the fouled team (who takes the kick). Mirrors
  // src/api/http_server/match_stats.py.
  if (details.foul) {
    const offenderId = details.offender_id || '';
    const offenderTeam = (roster[offenderId] || {}).team || '';
    const ots = teamStats[offenderTeam];
    const ops = playerStats[offenderId];
    if (ots) ots.fouls++;
    if (ops) ops.fouls++;
    const card = details.card;
    if (card === 'yellow' || card === 'red') {
      if (ots) ots[`${card}_cards`]++;
      if (ops) ops[`${card}_cards`]++;
    }
    if (details.restart_type === 'penalty_kick') {
      const fts = teamStats[details.restart_team || ''];
      if (fts) {
        fts.penalties_awarded++;
        if (details.penalty_outcome === 'goal') {
          fts.penalties_scored++;
          // Converted penalty: attribute the goal here — the shared goal
          // path keys off the GK's action, unreachable for system records.
          fts.goals++;
          fts.shots_on_target++;
          const takerPs = playerStats[details.scored_by || ''];
          if (takerPs) { takerPs.goals++; takerPs.shots_on_target++; }
        }
      }
    }
    return; // foul restart: system record — skip other counters
  }

  // OOB restart — keyed to restart_team
  if (details.out_of_bounds) {
    const restartType = details.restart_type || '';
    const restartTeam = details.restart_team || '';
    const rts = teamStats[restartTeam];
    if (rts) {
      if (restartType === 'corner_kick') rts.oob_corners++;
      else if (restartType === 'throw_in') rts.oob_throw_ins++;
      else if (restartType === 'goal_kick') rts.oob_goal_kicks++;
    }
    return;
  }

  // Goal scored (recorded on GK's action)
  const goalScoredTeam = details.goal_scored;
  if (goalScoredTeam) {
    const scoringTs = teamStats[goalScoredTeam];
    if (scoringTs) { scoringTs.goals++; scoringTs.shots_on_target++; }
    const scorerPs = playerStats[details.scored_by || ''];
    if (scorerPs) { scorerPs.goals++; scorerPs.shots_on_target++; }
  }

  const gkSave = details.goalkeeper_save;
  if (gkSave === 'success' || gkSave === 'blocked') {
    const shooterPs = playerStats[details.saved_from || ''];
    if (shooterPs) {
      teamStats[shooterPs.team].shots_on_target++;
      shooterPs.shots_on_target++;
    }
    if (gkSave === 'success') {
      if (ts) ts.gk_saves_caught++;
      if (ps) ps.gk_saves_caught++;
    } else {
      if (ts) ts.gk_saves_parried++;
      if (ps) ps.gk_saves_parried++;
    }
  }

  // Callback failure
  if (action === 'hold' && details.fallback_substituted) {
    if (ts) ts.callback_failures++;
    if (ps) ps.callback_failures++;
  }

  if (action === 'shoot') {
    if (ts) ts.shots++;
    if (ps) ps.shots++;
  } else if (action === 'pass') {
    if (ts) ts.passes_attempted++;
    if (ps) ps.passes_attempted++;
  } else if (action === 'tackle') {
    // Issue #38 follow-up — parity with match_stats.py (commit b50e042):
    // count genuine CONTESTS only. A Tackle intent can die before any
    // challenge (out_of_range, no_op_settled, no_op_carrier_changed,
    // no_op_restart_pending, or "ok" = consumed by a Phase 4 dribble
    // contest and credited via the carrier's dribble record below).
    // Counting those as attempts made tackle rates read absurdly low.
    // "Won" = carrier dispossessed: clean take (controlled) OR
    // deflection (blocked).
    if (result === 'controlled' || result === 'blocked' || result === 'failed' || result === 'foul') {
      if (ts) ts.tackles_attempted++;
      if (ps) ps.tackles_attempted++;
      if (result === 'controlled' || result === 'blocked') {
        if (ts) ts.tackles_successful++;
        if (ps) ps.tackles_successful++;
      }
    }
  } else if (action === 'move' && details.dribble_result != null) {
    if (ts) ts.dribbles_attempted++;
    if (ps) ps.dribbles_attempted++;
    if (details.dribble_result === 'success') {
      if (ts) ts.dribbles_successful++;
      if (ps) ps.dribbles_successful++;
    }
    // The same duel from the defender's side: the targeted defender was
    // challenging for the ball — a tackle attempt. A FAILED dribble means
    // the defender stole it: tackle won.
    const defenderId = details.dribble_target || '';
    const dinfo = roster[defenderId];
    if (dinfo) {
      const dts = teamStats[dinfo.team];
      const dps = playerStats[defenderId];
      if (dts) dts.tackles_attempted++;
      if (dps) dps.tackles_attempted++;
      if (details.dribble_result === 'failed') {
        if (dts) dts.tackles_successful++;
        if (dps) dps.tackles_successful++;
      }
    }
  }
}
</script>

<script>
// Agent Pitch — Match Statistics Panel Module
// Fetches GET /api/match/stats and renders a team-summary + per-player table
// below the scrub bar when a completed match is viewed.
//
// Public API (window.matchStats):
//   load(matchId)  — fetch stats for matchId, show panel
//   loadFromData(meta, ticks)  — compute stats from loaded data, show panel
//   hide()         — hide panel and toggle button
//   clear()        — reset to empty state (call on navigation away)

'use strict';

(function () {
  let _statsCache = null;
  let _visible = false;
  let _fetching = false;

  // ── Public API ────────────────────────────────────────────────────────────

  window.matchStats = {
    load(matchId) {
      _hidePanel();
      _statsCache = null;
      _visible = false;
      _showButton(matchId);
    },

    loadFromData(meta, ticks) {
      _hidePanel();
      _statsCache = null;
      _visible = false;
      // Compute stats synchronously from loaded data
      _statsCache = computeMatchStats(ticks, meta);
      _showButton('__local__');
      // Re-wire button to show cached data (no fetch needed)
      const btn = document.getElementById('stats-toggle');
      if (btn) {
        btn.onclick = () => {
          if (_visible) {
            _hidePanel();
            btn.classList.remove('active');
            _visible = false;
          } else {
            _visible = true;
            btn.classList.add('active');
            const panel = document.getElementById('match-stats-panel');
            if (panel) {
              panel.removeAttribute('hidden');
              panel.style.display = '';
              panel.classList.add('stats-fullview');
              const body = _fieldBody();
              if (body) body.style.display = 'none';
              _renderStats(panel, _statsCache);
            }
          }
        };
      }
    },

    hide() {
      _hidePanel();
      _hideButton();
    },

    clear() {
      _statsCache = null;
      _visible = false;
      _fetching = false;
      _hidePanel();
      _hideButton();
    },
  };

  // ── Button wiring ─────────────────────────────────────────────────────────

  function _showButton(matchId) {
    const btn = document.getElementById('stats-toggle');
    if (!btn) return;
    btn.removeAttribute('hidden');
    btn.style.display = '';    // clear any inline style from hideAllLiveViewerDOM
    btn.classList.remove('active');
    // Re-wire click on each load to bind the current matchId
    btn.onclick = () => _toggle(matchId);
  }

  function _hideButton() {
    const btn = document.getElementById('stats-toggle');
    if (btn) {
      btn.setAttribute('hidden', '');
      btn.classList.remove('active');
      btn.onclick = null;
    }
  }

  // ── Panel toggle ──────────────────────────────────────────────────────────

  // The field/live-view container. On the live server it lives under
  // #section-matches; in the standalone bundle there is no #section-matches
  // wrapper, so fall back to the bare `.body`. Show and restore MUST resolve
  // the same element, or toggling stats back to the live view leaves the
  // field hidden (display:none never cleared).
  function _fieldBody() {
    return document.querySelector('#section-matches .body')
        || document.querySelector('.body');
  }

  async function _toggle(matchId) {
    if (_fetching) return;  // ignore clicks while fetch is in-flight

    const panel = document.getElementById('match-stats-panel');
    const btn = document.getElementById('stats-toggle');
    if (!panel) return;

    if (_visible) {
      _hidePanel();
      if (btn) btn.classList.remove('active');
      _visible = false;
      return;
    }

    _visible = true;
    if (btn) btn.classList.add('active');
    panel.removeAttribute('hidden');
    panel.style.display = '';   // clear inline style from hideAllLiveViewerDOM
    panel.classList.add('stats-fullview');

    // Hide the field area so the stats panel fills the vacated space
    const body = _fieldBody();
    if (body) body.style.display = 'none';

    if (_statsCache) {
      _renderStats(panel, _statsCache);
      return;
    }

    _fetching = true;
    _renderLoading(panel);
    try {
      const resp = await fetch(`/api/match/stats?match_id=${encodeURIComponent(matchId)}`);
      if (resp.status === 409) {
        _renderError(panel, 'Match still in progress — stats available after completion.');
        return;
      }
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      _statsCache = await resp.json();
      _renderStats(panel, _statsCache);
    } catch (err) {
      console.error('[match-stats.js] fetch failed:', err);
      _renderError(panel, 'Could not load match statistics.');
    } finally {
      _fetching = false;
    }
  }

  function _hidePanel() {
    const panel = document.getElementById('match-stats-panel');
    if (panel) {
      panel.setAttribute('hidden', '');
      panel.classList.remove('stats-fullview');
    }
    // Restore the field area when leaving fullview stats
    const body = _fieldBody();
    if (body) body.style.display = '';
  }

  // ── Rendering ─────────────────────────────────────────────────────────────

  function _renderLoading(panel) {
    panel.innerHTML = '<div class="stats-loading">Computing statistics…</div>';
  }

  function _renderError(panel, msg) {
    panel.innerHTML = `<div class="stats-error">${_esc(msg)}</div>`;
  }

  function _renderStats(panel, stats) {
    const teams = stats.teams || {};
    const players = stats.players || {};
    const ta = teams.team_a || {};
    const tb = teams.team_b || {};

    panel.innerHTML = `
      <div class="stats-panel-header">
        <span>MATCH STATISTICS</span>
      </div>
      <div class="stats-panel-body">
        ${_teamSummaryHtml(ta, tb)}
        ${_playerSectionHtml(players, { team_a: ta.name, team_b: tb.name })}
      </div>
    `;
  }

  function _teamSummaryHtml(ta, tb) {
    const rows = [
      ['Possession',    _pct(ta.possession_pct),       _pct(tb.possession_pct)],
      ['Goals',         ta.goals ?? 0,                  tb.goals ?? 0],
      ['Assists',       ta.assists ?? 0,                tb.assists ?? 0],
      ['Shots',         ta.shots ?? 0,                  tb.shots ?? 0],
      ['Shots on target', ta.shots_on_target ?? 0,      tb.shots_on_target ?? 0],
      ['Passes (attempted)', ta.passes_attempted ?? 0,   tb.passes_attempted ?? 0],
      ['Tackles',       ta.tackles_attempted ?? 0,       tb.tackles_attempted ?? 0],
      ['Tackles won',   ta.tackles_successful ?? 0,      tb.tackles_successful ?? 0],
      ['Dribbles',      ta.dribbles_attempted ?? 0,      tb.dribbles_attempted ?? 0],
      ['Dribbles won',  ta.dribbles_successful ?? 0,     tb.dribbles_successful ?? 0],
      ['GK saves (caught)', ta.gk_saves_caught ?? 0,    tb.gk_saves_caught ?? 0],
      ['GK saves (parried)', ta.gk_saves_parried ?? 0,  tb.gk_saves_parried ?? 0],
      ['Corners',       ta.oob_corners ?? 0,             tb.oob_corners ?? 0],
      ['Throw-ins',     ta.oob_throw_ins ?? 0,           tb.oob_throw_ins ?? 0],
      ['Goal kicks',    ta.oob_goal_kicks ?? 0,          tb.oob_goal_kicks ?? 0],
      ['Offsides',      ta.offsides ?? 0,                tb.offsides ?? 0],
      // Issue #38 (IFAB Law 12): fouls, cards, penalties.
      ['Fouls',         ta.fouls ?? 0,                   tb.fouls ?? 0],
      ['Yellow cards',  ta.yellow_cards ?? 0,            tb.yellow_cards ?? 0],
      ['Red cards',     ta.red_cards ?? 0,               tb.red_cards ?? 0],
      ['Penalties (scored)',
        `${ta.penalties_scored ?? 0}/${ta.penalties_awarded ?? 0}`,
        `${tb.penalties_scored ?? 0}/${tb.penalties_awarded ?? 0}`],
      // Engine-specific metrics
      ['Callback failures', _engineVal(ta.callback_failures ?? 0), _engineVal(tb.callback_failures ?? 0), true],
    ];

    const rowsHtml = rows.map(([label, aVal, bVal, isEngine]) => `
      <tr>
        <td>${_esc(label)}</td>
        <td class="${isEngine ? 'val-engine' : 'val-a'}">${_esc(String(aVal))}</td>
        <td class="${isEngine ? 'val-engine' : 'val-b'}">${_esc(String(bVal))}</td>
      </tr>
    `).join('');

    return `
      <div class="stats-team-section">
        <div class="stats-section-label">Team Summary</div>
        <table class="stats-team-table" aria-label="Team statistics">
          <thead>
            <tr>
              <th></th>
              <th class="col-a">${_esc((ta.name || 'TEAM A').toUpperCase())}</th>
              <th class="col-b">${_esc((tb.name || 'TEAM B').toUpperCase())}</th>
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
    `;
  }

  function _playerSectionHtml(players, teamLabels) {
    const teamAPlayers = Object.entries(players)
      .filter(([, p]) => p.team === 'team_a')
      .sort(([, a], [, b]) => a.number - b.number);
    const teamBPlayers = Object.entries(players)
      .filter(([, p]) => p.team === 'team_b')
      .sort(([, a], [, b]) => a.number - b.number);

    return `
      <div class="stats-players-section">
        <div class="stats-section-label">Per Player</div>
        ${_teamPlayerTableHtml('team_a', teamLabels.team_a || 'TEAM A', teamAPlayers)}
        ${_teamPlayerTableHtml('team_b', teamLabels.team_b || 'TEAM B', teamBPlayers)}
      </div>
    `;
  }

  function _teamPlayerTableHtml(teamId, label, entries) {
    const isA = teamId === 'team_a';
    const labelClass = isA ? 'team-label-a' : 'team-label-b';
    label = label.toUpperCase();

    const rowsHtml = entries.map(([pid, p]) => {
      const numTag = p.number ? `#${p.number}` : pid.replace('team_a_', '#').replace('team_b_', '#');
      const shortPid = p.name ? `${p.name} ${numTag}` : numTag;
      const gkCols = p.role === 'GK'
        ? `<td>${p.gk_saves_caught ?? 0}/${(p.gk_saves_caught ?? 0) + (p.gk_saves_parried ?? 0)}</td>`
        : `<td class="val-dim">—</td>`;
      // Issue #38 (IFAB Law 12): fouls committed + card badges per player.
      const yc = p.yellow_cards ?? 0, rc = p.red_cards ?? 0;
      const cardBadges = (yc || rc)
        ? `${'🟨'.repeat(yc)}${'🟥'.repeat(rc)}`
        : '<span class="val-dim">—</span>';
      return `
        <tr>
          <td class="pid-cell">${_esc(shortPid)}</td>
          <td class="role-cell">${_esc(p.role)}</td>
          <td>${p.goals ?? 0}</td>
          <td>${p.assists ?? 0}</td>
          <td>${p.shots ?? 0}</td>
          <td>${p.shots_on_target ?? 0}</td>
          <td>${p.passes_attempted ?? 0}</td>
          <td>${p.tackles_attempted ?? 0}/${p.tackles_successful ?? 0}</td>
          <td>${p.dribbles_attempted ?? 0}/${p.dribbles_successful ?? 0}</td>
          ${gkCols}
          <td>${p.fouls ?? 0}</td>
          <td class="cards-cell">${cardBadges}</td>
          <td class="dist-cell">${p.distance_run?.toFixed(0) ?? '—'}m</td>
          <td>${p.callback_failures ?? 0}</td>
        </tr>
      `;
    }).join('');

    return `
      <details class="stats-team-detail" open>
        <summary><span class="${labelClass}">${label}</span> PLAYERS</summary>
        <table class="stats-player-table" aria-label="${label} player statistics">
          <thead>
            <tr>
              <th>#</th><th>Role</th><th>G</th><th title="Assists">A</th><th>Sh</th><th>SoT</th>
              <th>Pass</th><th>Tkl W/A</th><th>Drb W/A</th><th>GK Sv</th>
              <th title="Fouls committed">Fls</th><th title="Yellow / red cards">Cards</th>
              <th>Dist</th><th title="Callback failures">CB Fail</th>
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </details>
    `;
  }

  // ── Formatters ────────────────────────────────────────────────────────────

  function _pct(val) {
    if (val == null) return '—';
    return `${val.toFixed(1)}%`;
  }

  function _engineVal(val) {
    // Engine-specific metric — display as plain number
    return val;
  }

  function _esc(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
})();
</script>

<script>
// agent_pitch browser frontend — broadcast viewer.
// Adapted from prototypes/ui/viewer.jsx to vanilla DOM (per ADR-0010,
// no framework). Keeps all production data sources: /api/match,
// /api/match/ticks, /api/match/key-events, /api/strategy/{team_id}.
//
// Field is rendered to <canvas> with the broadcast palette; chyron,
// statbug, seasonbug, goal flash, scrubber, event ticker, code panel
// and status bar are HTML overlays.

// Field dimensions — start at the most-common 100×60 default, but get
// overwritten from meta.field_width / meta.field_height on first
// /api/match fetch (the engine writes these per-match as of 2026-04-25).
// Letting these be mutable means a 5v5 60×40 pitch renders with the right
// aspect ratio and player coordinates instead of a stretched 100×60.
let FIELD_W = 100;
let FIELD_H = 60;

// ── Mutable state ────────────────────────────────────────────────────
let allTicks = [];
let currentTick = 0;
let realTickToIdx = new Map();   // realTick → idx in allTicks (sparse)
let firstRealTick = 0;
let lastRealTick = 0;
let playing = false;
let lastTimestamp = 0;
let playSpeed = 1;               // multiplier on the 10 ticks/sec base rate
let teamFilter = "all";          // all | team_a | team_b
let _tickRate = 10;
let _totalTicks = 0;
let _phaseTransitions = [];
let _playerLabels = {};          // player_id → "A #4"
let _playerNumbers = {};         // player_id → jersey number
let _playerNames = {};           // player_id → display name (empty if absent)
let _teamADisplay = "TEAM A";    // populated from meta.teams.team_a.name
let _teamBDisplay = "TEAM B";    // populated from meta.teams.team_b.name
let _eventRows = [];             // cached extracted event rows
let _activeFx = [];              // [{kind, startTick, lifetime, ...}]
let _lastFxScannedTick = -1;     // newest tick we've already extracted fx for
let _matchId = "";
let _seed = "—";
let _logDir = "—";

// ── DOM handles ─────────────────────────────────────────────────────
const canvas = document.getElementById("field-canvas");
const ctx = canvas.getContext("2d");
// Hide the canvas until meta.json lands so we never paint a frame at the
// default 100×60 aspect for a non-default pitch (e.g. 5v5 60×40). loadMeta
// flips this back to "visible" once FIELD_W/FIELD_H are synced.
canvas.style.visibility = "hidden";
// Logical (CSS-pixel) canvas size. Set by _resizeCanvas() on init and
// on window resize. Drawing code uses these instead of canvas.width /
// canvas.height (which now hold the DPR-scaled BACKING STORE size).
let cssW = 800;
let cssH = 480;
let _devicePixelRatio = 1;

function _resizeCanvas() {
  // Compute the canvas's display size from pitch-stage's available space,
  // then write it back as inline width/height. This is more reliable than
  // CSS aspect-ratio + max-* constraints, which can produce overflow when
  // grid/flex sizing hasn't settled — particularly on the first paint
  // after navigation. The canvas is guaranteed to fit within pitch-stage
  // (minus padding) and never spills into the scrub bar below.
  const stage = canvas.parentElement;  // .pitch-stage
  const stageRect = stage ? stage.getBoundingClientRect() : null;
  if (stageRect && stageRect.width > 0 && stageRect.height > 0) {
    const cs = getComputedStyle(stage);
    const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    const availW = Math.max(100, stageRect.width  - padX);
    const availH = Math.max(60,  stageRect.height - padY);
    // Aspect from FIELD_W/FIELD_H (per-match values written by engine in meta).
    const aspect = FIELD_W / FIELD_H;
    // Fit-within: pick whichever dimension is the binding constraint.
    let w = availW, h = w / aspect;
    if (h > availH) { h = availH; w = h * aspect; }
    cssW = Math.round(w);
    cssH = Math.round(h);
    canvas.style.width  = cssW + "px";
    canvas.style.height = cssH + "px";
  } else {
    // Layout not ready — fall back to HTML attrs so we don't produce a
    // 0-byte backing store on first call.
    cssW = Math.max(100, canvas.width || 800);
    cssH = Math.max(60,  canvas.height || 480);
  }
  const dpr = window.devicePixelRatio || 1;
  _devicePixelRatio = dpr;
  // Backing store sized for crisp pixels on Retina / 4K.
  canvas.width  = cssW * dpr;
  canvas.height = cssH * dpr;
  // All drawing happens in CSS-pixel coordinates; the transform
  // upscales those onto the high-DPI backing store.
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// Debounced resize / repaint helper. Used by both the window resize
// listener and the ResizeObserver below.
let _resizeTimer = null;
function _scheduleRepaint() {
  if (_resizeTimer) clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(() => {
    _resizeCanvas();
    if (allTicks.length > 0) {
      const idx = realTickToIdx.get(currentTick);
      if (idx !== undefined) paintTick(idx);
    }
  }, 50);
}
window.addEventListener("resize", _scheduleRepaint);

// Observe the PITCH-STAGE (not the canvas itself) so we react to layout
// changes from font swaps / nav pin toggles / window resize, without the
// observer becoming a recursive feedback loop on our own canvas resizes.
if (typeof ResizeObserver !== "undefined") {
  const stage = canvas.parentElement;
  if (stage) new ResizeObserver(_scheduleRepaint).observe(stage);
}
